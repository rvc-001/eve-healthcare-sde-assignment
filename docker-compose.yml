version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # In Docker, we connect to the local 'db' service instead of Supabase
      - DATABASE_URL=postgresql://postgres:eve_password@db:5432/eve_healthcare
      - JWT_SECRET=super_secret_jwt_key_for_docker
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=eve_password
      - POSTGRES_DB=eve_healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
